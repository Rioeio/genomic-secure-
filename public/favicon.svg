<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Helix & Network Gradients -->
    <linearGradient id="cyanTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Tile Background -->
  <rect width="512" height="512" rx="112" fill="url(#shieldGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#cyanTeal)" stroke-width="6" opacity="0.6" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#0284C7" opacity="0.15" filter="url(#glow)" />

  <!-- Stylized Federated Cross (Outer Shape) -->
  <g transform="translate(256, 256) scale(0.92) translate(-256, -256)">
    <!-- Central Medical Cross Core -->
    <rect x="220" y="100" width="72" height="312" rx="20" fill="url(#cyanTeal)" opacity="0.25" />
    <rect x="100" y="220" width="312" height="72" rx="20" fill="url(#cyanTeal)" opacity="0.25" />

    <!-- Federated Learning Node Interconnects (Hexagon Nodes) -->
    <!-- Center Node -->
    <circle cx="256" cy="256" r="28" fill="#38BDF8" filter="url(#glow)" />
    <circle cx="256" cy="256" r="16" fill="#FFFFFF" />

    <!-- Node 1 (Top) -->
    <line x1="256" y1="256" x2="256" y2="128" stroke="#38BDF8" stroke-width="8" stroke-dasharray="6,6" opacity="0.8" />
    <circle cx="256" cy="128" r="22" fill="#0EA5E9" filter="url(#glow)" />
    <circle cx="256" cy="128" r="12" fill="#FFFFFF" />

    <!-- Node 2 (Bottom) -->
    <line x1="256" y1="256" x2="256" y2="384" stroke="#34D399" stroke-width="8" stroke-dasharray="6,6" opacity="0.8" />
    <circle cx="256" cy="384" r="22" fill="#10B981" filter="url(#glow)" />
    <circle cx="256" cy="384" r="12" fill="#FFFFFF" />

    <!-- Node 3 (Left) -->
    <line x1="256" y1="256" x2="128" y2="256" stroke="#38BDF8" stroke-width="8" stroke-dasharray="6,6" opacity="0.8" />
    <circle cx="128" cy="256" r="22" fill="#0EA5E9" filter="url(#glow)" />
    <circle cx="128" cy="256" r="12" fill="#FFFFFF" />

    <!-- Node 4 (Right) -->
    <line x1="256" y1="256" x2="384" y2="256" stroke="#34D399" stroke-width="8" stroke-dasharray="6,6" opacity="0.8" />
    <circle cx="384" cy="256" r="22" fill="#10B981" filter="url(#glow)" />
    <circle cx="384" cy="256" r="12" fill="#FFFFFF" />

    <!-- DNA Double Helix Waves Intertwined across Center -->
    <path d="M 140 180 Q 198 256 256 180 T 372 180" fill="none" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />
    <path d="M 140 332 Q 198 256 256 332 T 372 332" fill="none" stroke="#34D399" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />

    <!-- Base Pair Rungs -->
    <line x1="180" y1="205" x2="180" y2="307" stroke="#A7F3D0" stroke-width="5" stroke-linecap="round" opacity="0.75" />
    <line x1="332" y1="205" x2="332" y2="307" stroke="#BAE6FD" stroke-width="5" stroke-linecap="round" opacity="0.75" />

    <!-- Satellite Privacy Shield Ring -->
    <circle cx="256" cy="256" r="172" fill="none" stroke="url(#cyanTeal)" stroke-width="4" stroke-dasharray="14,14" opacity="0.4" />
  </g>
</svg>
